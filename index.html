<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>PetroCorp - Station Management Portal</title>
    <meta name="description"
        content="PetroCorp Station Manager - Enterprise fuel station management and operations portal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('petrocorp-theme');
                var theme = saved === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) { }
        })();
    </script>
</head>

<body class="login-body">
    <!-- Animated Grid Canvas Background -->
    <div class="grid-background" aria-hidden="true"></div>

    <!-- Small Dark/Light Mode Toggle -->
    <div class="login-topbar">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark and light mode"
            title="Toggle Light / Dark Mode">
            <svg class="theme-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <!-- Moon icon shown when in light mode (clicking switches to dark) -->
                <path class="moon-icon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                <!-- Sun icon shown when in dark mode (clicking switches to light) -->
                <circle class="sun-icon" cx="12" cy="12" r="5"></circle>
                <line class="sun-icon" x1="12" y1="1" x2="12" y2="3"></line>
                <line class="sun-icon" x1="12" y1="21" x2="12" y2="23"></line>
                <line class="sun-icon" x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line class="sun-icon" x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line class="sun-icon" x1="1" y1="12" x2="3" y2="12"></line>
                <line class="sun-icon" x1="21" y1="12" x2="23" y2="12"></line>
                <line class="sun-icon" x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line class="sun-icon" x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <main class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="brand-header">
                <h1 class="brand-title">R&P Petromanager</h1>
                <p class="brand-subtitle">Station Access & Management</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required placeholder="operator@petrocorp.com"
                            autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" id="forgot-password-link" class="link-subtle">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" required placeholder="••••••••••••"
                            autocomplete="current-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-role">Assigned Role</label>
                    <div class="select-wrapper">
                        <select id="login-role" required>
                            <option value="operator">Station Operator</option>
                            <option value="manager">Station Manager / Admin</option>
                        </select>
                    </div>
                </div>

                <div id="login-error" class="alert-box alert-error hidden" role="alert"></div>
                <div id="login-success" class="alert-box alert-success hidden" role="status"></div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                    <span class="btn-text">Authenticate & Sign In</span>
                    <span class="btn-spinner hidden"></span>
                </button>
            </form>


            <!-- Password Reset Modal/View -->
            <div id="reset-password-view" class="reset-wrapper hidden">
                <h3 class="reset-title">Reset Your Password</h3>
                <p class="reset-desc">Enter your registered work email. A secure recovery link will be dispatched to
                    your inbox.</p>

                <form id="reset-form" novalidate>
                    <div class="form-group">
                        <label for="reset-email">Work Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="reset-email" required placeholder="name@petrocorp.com">
                        </div>
                    </div>

                    <div id="reset-error" class="alert-box alert-error hidden" role="alert"></div>
                    <div id="reset-success" class="alert-box alert-success hidden" role="status"></div>

                    <div class="btn-row">
                        <button type="button" id="cancel-reset-btn" class="btn btn-secondary">Back to Login</button>
                        <button type="submit" id="send-reset-btn" class="btn btn-primary">Send Recovery Link</button>
                    </div>
                </form>
            </div>

            <footer class="login-footer">
                <p>Protected by Supabase Enterprise RLS & Multi-tenant Role Security.</p>
                <div class="station-meta">Enterprise Petroleum Retail Management • System v2.0</div>
            </footer>

        </div>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
