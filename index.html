<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>PetroCorp - Station Management Portal</title>
    <meta name="description"
        content="PetroCorp Station Manager - Enterprise fuel station management and operations portal">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('petrocorp-theme');
                var theme = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                theme = theme === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) { }
        })();
    </script>
    <style>
        /* ---------- Login page (scoped to .login-body) ---------- */
        :root {
            --lg-page: #e4ecf7;
            --lg-surface: #f0f4f9;
            --lg-ink: #10243a;
            --lg-muted: #5b6f86;
            --lg-line: #9fb3c9;
            --lg-field: #ffffff;
            --lg-primary: #2b5f82;
            --lg-primary-hover: #214c69;
            --lg-on-primary: #ffffff;
            --lg-link: #2b6a99;
            --lg-error-bg: #fdecec;
            --lg-error: #a32626;
            --lg-ok-bg: #e5f5ec;
            --lg-ok: #1b6a3d;
            --lg-sea-1: #1d4b69;
            --lg-sea-2: #34708f;
            --lg-sea-3: #6f9ab8;
            --lg-sea-4: #a9c4d8;
            --lg-amber: #f4c542;
            --lg-amber-deep: #e0a526;
        }

        :root[data-theme="dark"] {
            --lg-page: #0b1522;
            --lg-surface: #132235;
            --lg-ink: #e8f0f8;
            --lg-muted: #93a9c0;
            --lg-line: #34506b;
            --lg-field: #0d1a2a;
            --lg-primary: #5aa3cf;
            --lg-primary-hover: #7bb8de;
            --lg-on-primary: #08233a;
            --lg-link: #7bb8de;
            --lg-error-bg: #3a1a1d;
            --lg-error: #ffb4b4;
            --lg-ok-bg: #12301f;
            --lg-ok: #8fe0b0;
            --lg-sea-1: #0c2a40;
            --lg-sea-2: #164560;
            --lg-sea-3: #2a6483;
            --lg-sea-4: #4a86a8;
        }

        .login-body,
        .login-body * {
            box-sizing: border-box;
        }

        .login-body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
            background: var(--lg-page);
            color: var(--lg-ink);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .login-body .hidden {
            display: none !important;
        }

        .login-body .grid-background {
            display: none;
        }

        /* Theme toggle */
        .login-topbar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            right: 16px;
            z-index: 20;
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--lg-line);
            background: var(--lg-surface);
            color: var(--lg-ink);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .theme-toggle-btn:hover {
            transform: rotate(18deg);
        }

        .theme-toggle-btn:focus-visible,
        .login-card a:focus-visible,
        .login-card input:focus-visible,
        .login-card select:focus-visible,
        .login-card button:focus-visible {
            outline: 3px solid var(--lg-link);
            outline-offset: 2px;
        }

        .theme-icon-svg .sun-icon {
            display: none;
        }

        :root[data-theme="dark"] .theme-icon-svg .sun-icon {
            display: inline;
        }

        :root[data-theme="dark"] .theme-icon-svg .moon-icon {
            display: none;
        }

        /* Card */
        .login-wrapper {
            width: 100%;
            max-width: 1080px;
        }

        .login-card {
            position: relative;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            min-height: 600px;
            background: var(--lg-surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px -28px rgba(16, 36, 58, .45);
        }

        /* Illustration */
        .login-art {
            position: relative;
            min-height: 100%;
            overflow: hidden;
        }

        .login-art svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .art-caption {
            position: absolute;
            left: 40px;
            bottom: 36px;
            z-index: 2;
            padding: 10px 18px;
            border-radius: 999px;
            background: #f4c542;
            color: #10243a;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.01em;
            line-height: 1.2;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .45);
        }

        .login-art {
            background: var(--lg-sea-1);
        }

        .s1 {
            fill: var(--lg-sea-1);
        }

        .s2 {
            fill: var(--lg-sea-2);
        }

        .s3 {
            fill: var(--lg-sea-3);
        }

        .s4 {
            fill: var(--lg-sea-4);
        }

        .surf {
            fill: var(--lg-surface);
        }

        .cut-m {
            display: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        .login-body button,
        .login-body a {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .drop {
            animation: bob 4s ease-in-out infinite;
        }

        @keyframes bob {
            50% {
                transform: translateY(-8px);
            }
        }

        /* Form side */
        .login-form-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px 56px 32px 24px;
        }

        .brand-header {
            margin-bottom: 28px;
        }

        .brand-title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .brand-subtitle {
            margin: 4px 0 0;
            color: var(--lg-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .login-card label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--lg-ink);
        }

        .label-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .link-subtle,
        .login-card a {
            color: var(--lg-link);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .link-subtle:hover {
            text-decoration: underline;
        }

        .login-card input[type="email"],
        .login-card input[type="password"],
        .login-card input[type="text"],
        .login-card select {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1.5px solid var(--lg-line);
            border-radius: 8px;
            background: var(--lg-field);
            color: var(--lg-ink);
            font: inherit;
            font-size: 15px;
            transition: border-color .15s, box-shadow .15s;
        }

        .login-card select {
            cursor: pointer;
        }

        .login-card input::placeholder {
            color: var(--lg-muted);
            opacity: .7;
        }

        .login-card input:hover,
        .login-card select:hover {
            border-color: var(--lg-primary);
        }

        .login-card input:focus,
        .login-card select:focus {
            outline: none;
            border-color: var(--lg-primary);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--lg-primary) 22%, transparent);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: -2px 0 20px;
            font-size: 13px;
            color: var(--lg-muted);
        }

        .remember-row input {
            width: 16px;
            height: 16px;
            accent-color: var(--lg-primary);
        }

        .remember-row label {
            margin: 0;
            font-weight: 500;
            color: var(--lg-muted);
        }

        .alert-box {
            margin-bottom: 16px;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
        }

        .alert-error {
            background: var(--lg-error-bg);
            color: var(--lg-error);
        }

        .alert-success {
            background: var(--lg-ok-bg);
            color: var(--lg-ok);
        }

        .btn {
            height: 48px;
            padding: 0 22px;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background .15s, transform .1s;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: var(--lg-primary);
            color: var(--lg-on-primary);
        }

        .btn-primary:hover {
            background: var(--lg-primary-hover);
        }

        .btn-primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--lg-ink);
            border: 1.5px solid var(--lg-line);
        }

        .btn-block {
            width: 100%;
        }

        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-row {
            display: flex;
            gap: 12px;
        }

        .btn-row .btn {
            flex: 1;
            padding: 0 12px;
        }

        .reset-title {
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 700;
        }

        .reset-desc {
            margin: 0 0 20px;
            color: var(--lg-muted);
            font-size: 14px;
        }

        .login-footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid color-mix(in srgb, var(--lg-line) 45%, transparent);
            text-align: center;
            font-size: 12px;
            color: var(--lg-muted);
        }

        .login-footer p {
            margin: 0 0 2px;
        }

        .station-meta {
            opacity: .8;
        }

        /* Small tablets */
        @media (max-width: 860px) and (min-width: 701px) {
            .login-form-side {
                padding: 40px 32px 28px 8px;
            }

            .art-caption {
                left: 28px;
                bottom: 28px;
                font-size: 16px;
                padding: 8px 14px;
            }
        }

        /* Phones: illustration becomes a banner on top */
        @media (max-width: 700px) {
            .login-body {
                align-items: flex-start;
                padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
            }

            .login-card {
                grid-template-columns: 1fr;
                min-height: 0;
                border-radius: 18px;
            }

            .login-art {
                min-height: 0;
                height: min(calc((100vw - 24px) * .694), 360px);
            }

            .art-caption {
                display: none;
            }

            .cut-d {
                display: none;
            }

            .cut-m {
                display: inline;
            }

            .login-form-side {
                padding: 4px 22px 22px;
            }

            .brand-title {
                font-size: 24px;
            }

            .brand-header {
                margin-bottom: 22px;
            }

            .login-card input[type="email"],
            .login-card input[type="password"],
            .login-card input[type="text"],
            .login-card select {
                height: 50px;
                font-size: 16px;
            }

            /* 16px stops iOS zoom-on-focus */
            .btn {
                height: 52px;
            }

            .btn-row {
                flex-direction: column-reverse;
            }

            .remember-row input {
                width: 20px;
                height: 20px;
            }

            .login-topbar {
                top: calc(env(safe-area-inset-top, 0px) + 22px);
                right: 24px;
            }

            .theme-toggle-btn {
                background: color-mix(in srgb, var(--lg-surface) 88%, transparent);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .drop,
            .btn-spinner {
                animation: none;
            }
        }
    </style>
</head>

<body class="login-body">
    <div class="grid-background" aria-hidden="true"></div>

    <div class="login-topbar">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle dark and light mode"
            title="Toggle Light / Dark Mode">
            <svg class="theme-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="moon-icon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                <circle class="sun-icon" cx="12" cy="12" r="5"></circle>
                <line class="sun-icon" x1="12" y1="1" x2="12" y2="3"></line>
                <line class="sun-icon" x1="12" y1="21" x2="12" y2="23"></line>
                <line class="sun-icon" x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line class="sun-icon" x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line class="sun-icon" x1="1" y1="12" x2="3" y2="12"></line>
                <line class="sun-icon" x1="21" y1="12" x2="23" y2="12"></line>
                <line class="sun-icon" x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line class="sun-icon" x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <main class="login-wrapper">
        <div class="login-card">

            <!-- Illustration side -->
            <div class="login-art" aria-hidden="true">
                <svg viewBox="0 0 620 640" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                    <rect width="620" height="640" class="s1" />
                    <path d="M0 150 C90 90 190 130 280 80 C380 30 470 90 620 40 V640 H0Z" class="s2" />
                    <path d="M0 300 C110 230 200 290 310 220 C400 165 500 230 620 170 V640 H0Z" class="s3"
                        opacity=".75" />
                    <path d="M0 470 C120 410 210 470 330 410 C430 360 520 410 620 370 V640 H0Z" class="s4"
                        opacity=".55" />
                    <path d="M0 560 C130 520 230 570 350 530 C450 495 540 530 620 510 V640 H0Z" class="s1"
                        opacity=".9" />

                    <!-- Fuel pump -->
                    <g transform="translate(150 150)">
                        <rect x="0" y="0" width="170" height="260" rx="16" fill="#f4c542" />
                        <rect x="0" y="228" width="170" height="32" rx="8" fill="#e0a526" />
                        <rect x="22" y="26" width="126" height="70" rx="8" fill="#10243a" />
                        <rect x="34" y="40" width="70" height="12" rx="3" fill="#6fd3a0" />
                        <rect x="34" y="62" width="46" height="8" rx="3" fill="#6fd3a0" opacity=".55" />
                        <circle cx="128" cy="62" r="10" fill="#f4c542" opacity=".9" />
                        <rect x="22" y="116" width="126" height="14" rx="7" fill="#fff" opacity=".35" />
                        <rect x="22" y="142" width="80" height="14" rx="7" fill="#fff" opacity=".25" />
                        <!-- hose -->
                        <path d="M170 150 C230 150 235 230 214 280" fill="none" stroke="#10243a" stroke-width="12"
                            stroke-linecap="round" />
                        <rect x="198" y="272" width="32" height="46" rx="8" fill="#10243a" />
                    </g>

                    <!-- Droplets -->
                    <g fill="#fff">
                        <path class="drop"
                            d="M385 440 C385 440 405 468 405 482 A20 20 0 0 1 365 482 C365 468 385 440 385 440Z"
                            opacity=".95" />
                        <path class="drop" style="animation-delay:-1.4s"
                            d="M450 360 C450 360 464 380 464 390 A14 14 0 0 1 436 390 C436 380 450 360 450 360Z"
                            fill="#f4c542" />
                        <path class="drop" style="animation-delay:-2.6s"
                            d="M95 420 C95 420 108 438 108 448 A13 13 0 0 1 82 448 C82 438 95 420 95 420Z"
                            opacity=".8" />
                    </g>

                    <!-- Splash foam -->
                    <path d="M120 600 C150 548 200 560 215 520 C235 565 290 540 300 600Z" fill="#fff" opacity=".9" />
                    <path d="M300 600 C330 560 380 575 395 540 C412 575 450 565 470 600Z" fill="#fff" opacity=".75" />

                    <!-- Wave-cut edge into the form side -->
                    <path d="M620 0 H455 C520 110 440 210 500 320 C548 408 470 530 565 640 H620Z" class="cut-d surf" />
                    <path class="cut-m surf" d="M0 640 V515 C120 482 205 535 322 508 C432 484 522 526 620 498 V640Z" />
                </svg>
                <div class="art-caption"></div>
            </div>

            <!-- Form side -->
            <div class="login-form-side">
                <div class="brand-header">
                    <h1 class="brand-title">R&amp;P Petromanager</h1>
                    <p class="brand-subtitle">Sign in to manage your station</p>
                </div>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="email">Work email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" required placeholder="operator@petrocorp.com"
                                autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" id="forgot-password-link" class="link-subtle">Forgot password?</a>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" required placeholder="••••••••••••"
                                autocomplete="current-password">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="login-role">Assigned role</label>
                        <div class="select-wrapper">
                            <select id="login-role" required>
                                <option value="operator">Station Operator</option>
                                <option value="manager">Station Manager / Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="remember-row">
                        <input type="checkbox" id="remember-me">
                        <label for="remember-me">Keep me signed in on this device</label>
                    </div>

                    <div id="login-error" class="alert-box alert-error hidden" role="alert"></div>
                    <div id="login-success" class="alert-box alert-success hidden" role="status"></div>

                    <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                        <span class="btn-text">Sign in</span>
                        <span class="btn-spinner hidden"></span>
                    </button>
                </form>

                <!-- Password reset view -->
                <div id="reset-password-view" class="reset-wrapper hidden">
                    <h3 class="reset-title">Reset your password</h3>
                    <p class="reset-desc">Enter your work email and we'll send you a secure link to set a new password.
                    </p>

                    <form id="reset-form" novalidate>
                        <div class="form-group">
                            <label for="reset-email">Work email</label>
                            <div class="input-wrapper">
                                <input type="email" id="reset-email" required placeholder="name@petrocorp.com">
                            </div>
                        </div>

                        <div id="reset-error" class="alert-box alert-error hidden" role="alert"></div>
                        <div id="reset-success" class="alert-box alert-success hidden" role="status"></div>

                        <div class="btn-row">
                            <button type="button" id="cancel-reset-btn" class="btn btn-secondary">Back to sign
                                in</button>
                            <button type="submit" id="send-reset-btn" class="btn btn-primary">Send link</button>
                        </div>
                    </form>
                </div>

                <footer class="login-footer">
                    <p>Protected by Supabase Enterprise RLS &amp; multi-tenant role security.</p>
                    <div class="station-meta">Enterprise Petroleum Retail Management • System v2.0</div>
                </footer>
            </div>

        </div>
    </main>

    <script>
        /* Theme toggle: handled here so it works regardless of main.js */
        (function () {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            btn.addEventListener('click', function (e) {
                e.stopImmediatePropagation();
                var root = document.documentElement;
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                root.style.colorScheme = next;
                try { localStorage.setItem('petrocorp-theme', next); } catch (err) { }
            });
        })();
    </script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
